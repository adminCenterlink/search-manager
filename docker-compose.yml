services:
  # Search Manager (Spring Boot)
  # opensearch(host 9200)와 contact-intelligence(host 8180)는 모두 host에 떠 있으므로
  # host.docker.internal로 접근한다. 두 서비스는 compose 밖에서 별도로 관리한다.
  search-manager:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
#        - linux/arm64
    container_name: search-manager
    env_file: .env
    ports:
      - "${SERVER_PORT}:80"
    environment:
      - TZ=Asia/Seoul
      # 외부 의존성은 host.docker.internal로 접근
      - OPEN_SEARCH_HOST=host.docker.internal
      - SEARCH_INTELLIGENCE_HOST=http://host.docker.internal
      - UPLOAD_PATH=/app/upload # 파일 인덱싱 대상(NFS 마운트 지점) — 컨테이너 내부 경로
      - LOG_PATH=/app/logs # 로그 경로 — 파일 경로와 분리(로컬)
      - SEARCH_INDEXES_FILE_LOCAL_PATH_PREFIX=/Users/centerlink/app/upload # localPathPrefix 명시적 설정
    extra_hosts:
      - "host.docker.internal:host-gateway" # 컨테이너에서 host의 opensearch(9200)/contact-intelligence(8180) 접근
    volumes:
      - "${UPLOAD_PATH}:/app/upload" # host의 UPLOAD_PATH(파일, NFS 마운트 지점)를 컨테이너 /app/upload로
      - "${LOG_PATH}:/app/logs" # host의 LOG_PATH(로그)를 컨테이너 /app/logs로
